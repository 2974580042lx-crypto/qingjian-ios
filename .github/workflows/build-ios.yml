name: Build Sermo 1.7.0 IPA

on:
  workflow_dispatch:
  push:
    branches: ['build/sermo-1.7.0-20261021']
    paths:
      - 'QingJian-iOS-source.zip'
      - 'source-overlay.zip'
      - 'source-manifest.json'
      - 'source-deletions.json'
      - 'apply-source-overlay.py'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

concurrency:
  group: qingjian-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
      - name: Reconstruct and verify exact supplied source
        run: python3 apply-source-overlay.py
      - name: Build, test and package unsigned IPA
        env:
          QINGJIAN_CAPTURE_PREVIEWS: '1'
        run: |
          set -o pipefail
          bash QingJian/scripts/build-ipa.sh 2>&1 | tee qingjian-build.log
      - name: Downloadable IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sermo-1.7.0-build31-20261021-unsigned-IPA
          path: QingJian/build/QingJian-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sermo-1.7.0-build31-20261021-build-log
          path: qingjian-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sermo-1.7.0-build31-20261021-ui-previews
          path: QingJian/build/previews
          if-no-files-found: ignore
          retention-days: 7
