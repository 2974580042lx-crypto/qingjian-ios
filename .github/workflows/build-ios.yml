name: Build Sermo

# Builds on every push that touches the app, on any branch, so work branches get a build too.
# Two jobs run side by side:
#   - ipa:   compiles Release and uploads an unsigned IPA named with the real version.
#   - tests: runs the offline unit tests. A red tests job does NOT block the IPA;
#            it shows up as a red X on the commit so problems are visible before installing.

on:
  workflow_dispatch:
    inputs:
      offline_only:
        description: Run the offline Swift tests only
        type: boolean
        default: false
  push:
    paths:
      - 'QingJian/**'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read
concurrency:
  group: sermo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    if: github.event.inputs.offline_only != 'true'
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select Xcode
        shell: bash
        run: |
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode_26.1.1.app /Applications/Xcode_26.0.1.app; do
            if [[ -d "$candidate/Contents/Developer" ]]; then
              echo "DEVELOPER_DIR=$candidate/Contents/Developer" >> "$GITHUB_ENV"
              break
            fi
          done
      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          marketing=$(grep -m1 -o 'MARKETING_VERSION = [^;]*' QingJian/QingJian.xcodeproj/project.pbxproj | sed 's/.*= //; s/"//g')
          build=$(grep -m1 -o 'CURRENT_PROJECT_VERSION = [^;]*' QingJian/QingJian.xcodeproj/project.pbxproj | sed 's/.*= //; s/"//g')
          name="Sermo-${marketing}-build${build}-unsigned"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Building $name"
      - name: Check project structure
        run: python3 QingJian/scripts/check-project.py
      - name: Compile Release and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee sermo-build.log) 2>&1
          xcodebuild -version
          cd QingJian
          mkdir -p build
          xcodebuild -project QingJian.xcodeproj -scheme QingJian -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build
          APP_PATH="$PWD/build/DerivedData/Build/Products/Release-iphoneos/DeepSeekPocket.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          ditto "$APP_PATH" build/Payload/DeepSeekPocket.app
          ditto -c -k --keepParent build/Payload "build/${{ steps.version.outputs.name }}.ipa"
          shasum -a 256 "build/${{ steps.version.outputs.name }}.ipa"
      - name: Downloadable IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}-IPA
          path: QingJian/build/${{ steps.version.outputs.name }}.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: sermo-build.log
          if-no-files-found: ignore
          retention-days: 14

  attachment-ui:
    if: github.event.inputs.offline_only != 'true'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test photo and file picker handoffs
        working-directory: QingJian
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode_26*.app; do
            if [[ -d "$candidate/Contents/Developer" ]]; then export DEVELOPER_DIR="$candidate/Contents/Developer"; fi
          done
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for r,devices in sorted(json.load(sys.stdin)["devices"].items(),reverse=True) if ".iOS-" in r for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl addmedia "$device" Tests/Fixtures/study-backup-question.jpg
          xcodebuild test -project QingJian.xcodeproj -scheme QingJian ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO -only-testing:QingJianUITests/NavigationUITests/testAttachmentPickersReopenAfterCancellation -only-testing:QingJianUITests/NavigationUITests/testSendPhotoFromSystemLibrary -resultBundlePath "$RUNNER_TEMP/Attachments.xcresult"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: attachment-ui-results
          path: ${{ runner.temp }}/Attachments.xcresult

  tests:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select Xcode
        shell: bash
        run: |
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode_26.1.1.app /Applications/Xcode_26.0.1.app; do
            if [[ -d "$candidate/Contents/Developer" ]]; then
              echo "DEVELOPER_DIR=$candidate/Contents/Developer" >> "$GITHUB_ENV"
              break
            fi
          done
      - name: Offline unit tests (live-model tests skipped, they need API keys)
        shell: bash
        run: |
          set -euo pipefail
          cd QingJian
          find DeepSeekPocket -name '*.swift' -print0 | xargs -0 xcrun swiftc -frontend -parse -target arm64-apple-ios26.0
          swift test --skip StudyLiveModelTests 2>&1 | tee ../swift-tests.log
      - name: Test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: swift-tests.log
          if-no-files-found: ignore
          retention-days: 14
