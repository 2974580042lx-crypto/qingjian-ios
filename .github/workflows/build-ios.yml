name: Build Sermo 1.12.0 IPA - compile only

on:
  workflow_dispatch:
  push:
    branches: ['build/sermo-1.12.0-20261021-2009']
    paths:
      - 'QingJian-iOS-source.zip'
      - 'source-manifest.json'
      - 'apply-source-overlay.py'

permissions:
  contents: read
concurrency:
  group: qingjian-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout supplied source
        uses: actions/checkout@v6
      - name: Verify archive and reconstruct exact source
        run: python3 apply-source-overlay.py
      - name: Compile Release and package unsigned IPA (no tests or previews)
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee qingjian-build.log) 2>&1
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode_26.1.1.app /Applications/Xcode_26.0.1.app; do
            if [[ -d "$candidate/Contents/Developer" ]]; then
              export DEVELOPER_DIR="$candidate/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          cd QingJian
          mkdir -p build
          xcodebuild -project QingJian.xcodeproj -scheme QingJian -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build
          APP_PATH="$PWD/build/DerivedData/Build/Products/Release-iphoneos/DeepSeekPocket.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          ditto "$APP_PATH" build/Payload/DeepSeekPocket.app
          ditto -c -k --keepParent build/Payload build/Sermo-1.12.0-build36-20261021-2009-unsigned.ipa
          shasum -a 256 build/Sermo-1.12.0-build36-20261021-2009-unsigned.ipa
          echo "Compilation completed. Functional checks, unit tests, UI tests, and screenshots were not run, as requested."
      - name: Downloadable IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sermo-1.12.0-build36-20261021-2009-unsigned-IPA
          path: QingJian/build/Sermo-1.12.0-build36-20261021-2009-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sermo-1.12.0-build36-20261021-2009-build-log
          path: qingjian-build.log
          if-no-files-found: ignore
          retention-days: 7
